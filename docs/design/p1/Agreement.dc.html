<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap">
  <style>
    :root{
      --bg:#f6f4ef;--surface:#fffdf9;--ink:#2b2a27;--soft:#6b6862;--line:#e3ddd2;
      --accent:#7c8a6a;--accent-ink:#46503a;--warn:#9a6b4b;
      --serif:"Noto Serif SC",Georgia,"Songti SC",serif;
      --sans:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7}
    a{color:var(--warn)}a:hover{color:#7c5238}
    .screen{width:390px;min-height:844px;margin:0 auto;padding:0 24px 40px}
    .status-space{height:44px}
    .topnav{display:flex;align-items:center;gap:10px;padding:14px 0 6px;color:var(--soft);font-size:13px}
    .topnav svg{width:18px;height:18px}
    h1{font-family:var(--serif);font-weight:600;font-size:20px;margin:14px 0 4px}
    .lead{color:var(--soft);font-size:13px;margin:0 0 14px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
    .opt{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
    .opt:last-child{border-bottom:none}
    .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--accent);flex-shrink:0;margin-top:3px;display:flex;align-items:center;justify-content:center}
    .box.on{background:var(--accent)}
    .box.on svg{width:12px;height:12px;color:#fff}
    .box.off{border-color:var(--line)}
    .opt .t{font-size:14px;font-weight:600}
    .opt .d{font-size:12px;color:var(--soft);margin-top:2px}
    .req{font-size:11px;color:var(--accent-ink);background:#ecefe4;border-radius:999px;padding:1px 7px;margin-left:6px}
    .btn{display:block;width:100%;text-align:center;font:inherit;font-size:15px;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:12px 0;margin-top:18px}
    .hint{font-size:11px;color:var(--soft);margin-top:12px}
    .muted{opacity:.5}
  </style>
</helmet>
<div class="screen">
  <div class="status-space"></div>
  <div class="topnav">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 18l-6-6 6-6"/></svg>
    返回
  </div>

  <h1>《用户内容与授权协议》</h1>
  <p class="lead">协议版本 2026-09-02。著作权仍归你。请选择你愿意授权的范围。</p>

  <div class="card">
    <div class="opt">
      <div class="box on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></div>
      <div>
        <div class="t">送达 / 展示给被分享人<span class="req">必选</span></div>
        <div class="d">平台获非独占许可，用于把这份祝福送到你分享的人手里。不同意则无法生成分享链接。</div>
      </div>
    </div>
    <div class="opt">
      <div class="box on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></div>
      <div>
        <div class="t">平台精选展示（默认跟随个人空间的偏好，可取消）</div>
        <div class="d">允许平台在「精选」「看见善意」等栏目展示你的祝福。可随时在祝福详情里关闭。</div>
      </div>
    </div>
    <div class="opt muted">
      <div class="box off"></div>
      <div>
        <div class="t">未来音视频合成 / 演绎</div>
        <div class="d">P1 不涉及，仅提前告知。</div>
      </div>
    </div>
  </div>

  <div class="btn">同意并继续</div>
  <p class="hint">每次同意都会留痕（版本、时间、逐项选择）。协议改版后下次创作会要求重新确认。<br>「精选展示」默认开启是否合规，以法务确认为准；后台可一键切换为默认关闭（opt-in）。</p>
</div>
</x-dc>
</body>
</html>

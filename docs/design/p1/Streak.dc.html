<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap">
  <style>
    :root{
      --bg:#f6f4ef;--surface:#fffdf9;--ink:#2b2a27;--soft:#6b6862;--line:#e3ddd2;
      --accent:#7c8a6a;--accent-ink:#46503a;--warn:#9a6b4b;
      --serif:"Noto Serif SC",Georgia,"Songti SC",serif;
      --sans:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7}
    .screen{width:390px;min-height:844px;margin:0 auto;padding:0 24px 40px}
    .status-space{height:44px}
    .topnav{padding:14px 0 6px;color:var(--soft);font-size:13px}
    h1{font-family:var(--serif);font-weight:600;font-size:20px;margin:14px 0 4px}
    .lead{color:var(--soft);font-size:13px;margin:0 0 16px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 18px;text-align:center}
    .num{font-family:var(--serif);font-size:44px;color:var(--accent-ink);line-height:1.1}
    .cap{font-size:12px;color:var(--soft)}
    .divider{height:1px;background:var(--line);margin:20px 0}
    .list{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-top:12px}
    h2{font-size:12px;color:var(--soft);margin:0 0 8px;font-weight:600}
    .day{font-size:13px;color:var(--soft);padding:5px 0}
    .hint{font-size:11px;color:var(--soft);margin-top:14px}
    .breathe{width:40px;height:40px;border-radius:50%;border:1px solid var(--accent);opacity:.45;margin:0 auto 16px}
  </style>
</helmet>
<div class="screen">
  <div class="status-space"></div>
  <div class="topnav">坚持</div>
  <h1>坚持</h1>
  <p class="lead">这里只有你自己看得到。没有排名，没有积分，只是一个安静的记录。</p>

  <div class="card">
    <div class="breathe"></div>
    <div class="num">4</div>
    <div class="cap">连续天数</div>
    <div class="divider"></div>
    <div class="num">11</div>
    <div class="cap">累计写下的祝福</div>
  </div>

  <div class="list">
    <h2>最近</h2>
    <div class="day">2026-09-02 · 1 条</div>
    <div class="day">2026-09-01 · 2 条</div>
    <div class="day">2026-08-31 · 1 条</div>
    <div class="day">2026-08-30 · 1 条</div>
  </div>

  <p class="hint">撤回 / 删除 / 下架会即时回撤对应的计数。坚持记录不会变成积分、等级或任何可兑换的东西。</p>
</div>
</x-dc>
</body>
</html>
